<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="since msitte is beta, you can join us, test it for free and provide feedback. here is a quick tutorial to use msitte">
    <meta name="keywords" content="msitte, beta, msitte beta, AI agents, skills, tutorial, testing">

    <meta name="robots" content="index, follow">
    <meta name="theme-color" content="#6176FF">
    <link rel="canonical" href="https://msitte.pages.dev/beta">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://msitte.pages.dev/beta">
    <meta property="og:title" content="since msitte is beta - msitte">
    <meta property="og:description" content="since msitte is beta, you can join us, test it for free and provide feedback. here is a quick tutorial to use msitte">

    <meta property="og:site_name" content="msitte">

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:url" content="https://msitte.pages.dev/beta">
    <meta name="twitter:title" content="since msitte is beta - msitte">
    <meta name="twitter:description" content="since msitte is beta, you can join us, test it for free and provide feedback.">

    <link href="style.css" rel="stylesheet">
    <link href="beta.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
</head>
<body class="beta-body">
    <!-- Highest Quality Scalable Vector Background -->
    <svg class="beta-bg-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 576" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
        <!-- Upper gentle wave -->
        <path d="M -20,120 C 120,90 240,95 360,118 C 480,140 600,190 720,215 C 840,240 920,225 1044,165" fill="none" stroke="#536AFF" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
        <!-- Continuous looping ribbon -->
        <path d="M -20,515 C 150,485 300,445 405,395 C 430,360 455,290 500,255 C 540,225 640,220 685,255 C 715,280 705,305 660,325 C 595,355 490,380 435,395 C 390,405 440,425 535,428 C 630,428 735,410 840,380 C 930,355 980,335 1044,320" fill="none" stroke="#536AFF" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>

    <!-- Standard msitte Navigation Bar -->
    <div class="navbar beta-navbar-override">
        <a href="/" class="companyLogoLink" title="msitte" aria-label="msitte home">
            <img src="images/m.png" alt="msitte logo" class="companyLogoImg">
        </a>
        <div class="midNav">
            <a class="navLink" href="developers/docs/introduction.html">Docs</a>
            <a class="navLink" href="https://discord.gg/5KctFJj9Qk" target="_blank" rel="noopener noreferrer">Community</a>
            <a class="navLink" href="https://github.com/ucursor/msitte" target="_blank" rel="noopener noreferrer">GitHub</a>
            <button type="button" class="navSearchBtn" id="searchTriggerBtn" aria-label="Search website and docs">
                <span class="material-symbols-outlined">search</span>
                <span class="navSearchLabel">Search</span>
                <kbd>⇧ / ⌘ F</kbd>
            </button>
        </div>
    </div>

    <!-- Main Content -->
    <main class="beta-main">
        <section class="beta-hero">
            <h1 class="beta-title">since msitte is beta,</h1>
            <p class="beta-subtitle">you can join us, test it for free and provide feedback.</p>
            <p class="beta-note">here is a quick tutorial to use msitte</p>
        </section>

        <!-- Empty Video Placeholder with Small Outline -->
        <section class="video-placeholder-container" aria-label="Tutorial Video Player">
            <video id="betaTutorialVideo" class="tutorial-video" controls playsinline preload="metadata">
                <!-- Drop your video source here when ready: -->
                <!-- <source src="tutorial.mp4" type="video/mp4"> -->
                Your browser does not support the video tag.
            </video>
        </section>
    </main>

    <!-- Site-wide Search Modal -->
    <div id="searchModal" class="search-modal-backdrop" aria-hidden="true" role="dialog" aria-modal="true" aria-label="Search msitte and laucn">
        <div class="search-modal-panel">
            <div class="search-input-wrapper">
                <span class="material-symbols-outlined search-input-icon">search</span>
                <input type="text" id="siteSearchInput" class="search-input" placeholder="Search skills, guardrails, docs, beta..." autocomplete="off" spellcheck="false">
                <button type="button" class="search-close-btn" id="searchCloseBtn" aria-label="Close search">
                    <span class="material-symbols-outlined">close</span>
                </button>
            </div>
            <div class="search-results-list" id="searchResultsList" role="listbox"></div>
            <div class="search-modal-footer">
                <span><kbd>↑</kbd> <kbd>↓</kbd> to navigate</span>
                <span><kbd>Enter</kbd> to select</span>
                <span><kbd>Esc</kbd> to close</span>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        // Reveal video element when a valid source is attached
        document.addEventListener('DOMContentLoaded', () => {
            const video = document.getElementById('betaTutorialVideo');
            if (!video) return;

            function checkSource() {
                const hasSource = Boolean(
                    (video.src && video.src !== window.location.href) ||
                    (video.querySelector('source') && video.querySelector('source').getAttribute('src'))
                );
                if (hasSource) {
                    video.classList.add('active');
                } else {
                    video.classList.remove('active');
                }
            }

            checkSource();
        });
    </script>
</body>
</html>
