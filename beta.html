<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Open Graph / Facebook -->

    <!-- Twitter -->

    <link href="style.css" rel="stylesheet">
    <link href="beta.css?v=5" rel="stylesheet">
    <link href="video-player.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Code:ital,wght,MONO@0,300..800,1;1,300..800,1&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

    <style>
        *, *::before, *::after {
            box-sizing: border-box;
        }

        /* Immediate Critical Inline CSS */
        html, body {
            margin: 0;
            padding: 0;
            background-color: #6176FF;
            color: #FFFFFF;
            font-family: 'Google Sans Code', 'Consolas', 'Courier New', monospace;
            overflow-x: hidden;
            min-height: 100vh;
            width: 100%;
        }

        .beta-bg-svg {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            pointer-events: none !important;
            z-index: 0 !important;
            display: block !important;
        }

        .beta-page-wrapper {
            position: relative;
            z-index: 5;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            width: 100%;
        }

        .beta-navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1.2rem 2.5rem 0 2.5rem;
            max-width: 1240px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
        }

        .betaLogoLink {
            display: flex;
            align-items: center;
            opacity: 0.9;
            text-decoration: none;
            transition: opacity 0.2s ease, transform 0.2s ease;
            flex-shrink: 0;
        }

        .betaLogoLink:hover {
            opacity: 1;
            transform: scale(1.06);
        }

        .betaLogoImg {
            width: 28px;
            height: 28px;
            object-fit: contain;
            display: block;
        }

        .betaMidNav {
            display: flex;
            align-items: center;
            gap: 1.4rem;
            font-family: 'Inter', -apple-system, sans-serif;
            flex-shrink: 0;
        }

        .betaNavLink {
            color: rgba(255, 255, 255, 0.82);
            font-size: 0.92rem;
            font-weight: 500;
            text-decoration: none;
            transition: color 0.15s ease, transform 0.15s ease;
            white-space: nowrap;
        }

        .betaNavLink:hover {
            color: #ffffff;
            transform: translateY(-1px);
        }

        .betaSearchBtn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: #ffffff;
            border-radius: 6px;
            padding: 5px 10px;
            font-family: inherit;
            font-size: 0.82rem;
            cursor: pointer;
            backdrop-filter: none;
            transition: background-color 0.15s ease, border-color 0.15s ease;
            flex-shrink: 0;
        }

        .betaSearchBtn:hover {
            background: rgba(255, 255, 255, 0.22);
            border-color: rgba(255, 255, 255, 0.45);
        }

        .betaSearchBtn kbd {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            border-radius: 4px;
            padding: 1px 5px;
            font-size: 0.72rem;
            margin-left: 4px;
        }

        .beta-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            max-width: 1240px;
            width: 100%;
            margin: 0 auto;
            padding: 2.2rem 1.5rem 3rem 1.5rem;
            box-sizing: border-box;
        }

        .beta-hero {
            margin-bottom: 1.5rem;
            text-align: left;
            width: 100%;
        }

        .beta-title {
            font-family: 'Google Sans Code', 'Consolas', monospace;
            font-size: clamp(1.45rem, 3.8vw, 2.75rem);
            font-weight: 700;
            letter-spacing: -0.01em;
            color: #ffffff;
            margin: 0 0 0.5rem 0;
            line-height: 1.2;
            word-break: break-word;
        }

        .beta-subtitle {
            font-family: 'Google Sans Code', 'Consolas', monospace;
            font-size: clamp(0.85rem, 1.8vw, 1.28rem);
            font-weight: 400;
            letter-spacing: -0.01em;
            color: #ffffff;
            margin: 0 0 0.5rem 0;
            line-height: 1.45;
            word-break: break-word;
        }

        .beta-note {
            font-family: 'Google Sans Code', 'Consolas', monospace;
            font-size: clamp(0.78rem, 1.4vw, 1.02rem);
            font-weight: 400;
            color: rgba(255, 255, 255, 0.8);
            margin: 0;
            line-height: 1.4;
            word-break: break-word;
        }

        .beta-video-container {
            width: 100%;
            aspect-ratio: 16 / 9;
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.02);
            position: relative;
            overflow: hidden;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .beta-video-container:hover {
            border-color: rgba(255, 255, 255, 0.45);
        }

        .tutorial-video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 15px;
            display: none;
            background: transparent;
        }

        .tutorial-video.active {
            display: block;
        }

        @media (max-width: 768px) {
            .beta-navbar {
                padding: 0.85rem 1.25rem 0 1.25rem;
            }
            .betaMidNav {
                gap: 0.85rem;
            }
            .betaNavLink {
                font-size: 0.84rem;
            }
            .betaSearchBtn {
                padding: 4px 7px;
            }
            .navSearchLabel, .betaSearchBtn kbd {
                display: none;
            }
            .beta-main {
                padding: 1.5rem 1.25rem 2.5rem 1.25rem;
            }
            .beta-hero {
                margin-bottom: 1.25rem;
            }
            .beta-video-container {
                border-radius: 12px;
            }
        }

        @media (max-width: 600px) {
            .betaMidNav .betaNavLink[href="/"] {
                display: none;
            }
            .betaMidNav {
                gap: 0.75rem;
            }
        }

        @media (max-width: 480px) {
            .beta-navbar {
                padding: 0.75rem 1rem 0 1rem;
            }
            .betaMidNav {
                gap: 0.6rem;
            }
            .betaNavLink {
                font-size: 0.8rem;
            }
            .betaLogoImg {
                width: 24px;
                height: 24px;
            }
            .beta-main {
                padding: 1.2rem 1rem 2rem 1rem;
            }
            .betaSearchBtn {
                padding: 3px 6px;
            }
            .betaSearchBtn .material-symbols-outlined {
                font-size: 18px;
            }
        }

        @media (max-width: 360px) {
            .beta-navbar {
                padding: 0.5rem 0.75rem 0 0.75rem;
            }
            .betaMidNav {
                gap: 0.45rem;
            }
            .betaNavLink {
                font-size: 0.75rem;
            }
            .beta-main {
                padding: 1rem 0.75rem 1.5rem 0.75rem;
            }
        }
    </style>
</head>
<body class="beta-body">
    <!-- Vector Looping Ribbon Background: Fixed & Behind Content -->
    <svg class="beta-bg-svg" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 0; display: block;" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 576" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
        <!-- Upper gentle wave -->
        <path d="M -20,120 C 120,90 240,95 360,118 C 480,140 600,190 720,215 C 840,240 920,225 1044,165" fill="none" stroke="#536AFF" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
        <!-- Continuous looping ribbon -->
        <path d="M -20,515 C 150,485 300,445 405,395 C 430,360 455,290 500,255 C 540,225 640,220 685,255 C 715,280 705,305 660,325 C 595,355 490,380 435,395 C 390,405 440,425 535,428 C 630,428 735,410 840,380 C 930,355 980,335 1044,320" fill="none" stroke="#536AFF" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>

    <!-- Page Wrapper -->
    <div class="beta-page-wrapper">
        <!-- Top Navbar -->
        <header class="beta-header">
            <nav class="beta-navbar" aria-label="Main Navigation">
                <a href="/" class="betaLogoLink" title="msitte" aria-label="msitte home">
                    <img src="images/m.png" alt="msitte logo" class="betaLogoImg">
                </a>

                <div class="betaMidNav">
                    <a class="betaNavLink" href="/">Home</a>
                    <a class="betaNavLink" href="developers/docs/introduction.html">Docs</a>
                    <a class="betaNavLink" href="https://discord.gg/5KctFJj9Qk" target="_blank" rel="noopener noreferrer">Community</a>
                    <a class="betaNavLink" href="https://github.com/ucursor/msitte" target="_blank" rel="noopener noreferrer">GitHub</a>
                    <button type="button" class="betaSearchBtn" id="searchTriggerBtn" aria-label="Search website and docs">
                        <span class="material-symbols-outlined">search</span>
                        <span class="navSearchLabel">Search</span>
                        <kbd>⇧ / ⌘ F</kbd>
                    </button>
                </div>
            </nav>
        </header>

        <!-- Main Content Section -->
        <main class="beta-main">
            <section class="beta-hero">
                <h1 class="beta-title">since msitte is beta,</h1>
                <p class="beta-subtitle">you can join us, test it for free and provide feedback.</p>
                <p class="beta-note">here is a quick tutorial to use msitte</p>
            </section>

            <!-- msitte Beta Video Player -->
            <div class="msitte-player-wrapper">
                <div class="msitte-player-container is-expanded" tabindex="0" role="region" aria-label="msitte Beta Tutorial Video Player">
                    <video class="msitte-video-element" autoplay muted playsinline loop preload="auto">
                        <source src="mainvideo.mp4" type="video/mp4">
                        Your browser does not support HTML5 video.
                    </video>

                    <!-- Click to Unmute Badge -->
                    <button type="button" class="unmute-badge" aria-label="Unmute audio" title="Click to unmute">
                        <span class="material-symbols-outlined">volume_off</span>
                        <span>Click to unmute</span>
                    </button>

                    <!-- Double Click / Tap Skip Ripples (YouTube style) -->
                    <div class="skip-feedback skip-feedback-left" aria-hidden="true">
                        <div class="skip-ripple">
                            <span class="material-symbols-outlined skip-icon">replay_5</span>
                            <span class="skip-text">-5s</span>
                        </div>
                    </div>
                    <div class="skip-feedback skip-feedback-right" aria-hidden="true">
                        <div class="skip-ripple">
                            <span class="material-symbols-outlined skip-icon">forward_5</span>
                            <span class="skip-text">+5s</span>
                        </div>
                    </div>

                    <!-- Big Center Play Button Overlay -->
                    <button type="button" class="center-play-btn" aria-label="Play video">
                        <span class="material-symbols-outlined">play_arrow</span>
                    </button>

                    <!-- Size Pill Indicator -->
                    <div class="player-size-pill" title="Click to shrink or press T">
                        <span class="material-symbols-outlined">aspect_ratio</span>
                        <span>Compact mode</span>
                    </div>

                    <!-- Player Controls Overlay -->
                    <div class="player-controls">
                        <!-- Timeline / Scrub bar -->
                        <div class="timeline-container" role="slider" aria-label="Video Timeline" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
                            <div class="timeline-hover-time">0:00</div>
                            <div class="timeline-track">
                                <div class="timeline-buffer"></div>
                                <div class="timeline-progress"></div>
                                <div class="timeline-thumb"></div>
                            </div>
                        </div>

                        <!-- Bottom Controls Bar -->
                        <div class="controls-bar">
                            <div class="controls-left">
                                <button type="button" class="ctrl-btn play-pause-btn" aria-label="Play (Space)">
                                    <span class="material-symbols-outlined">play_arrow</span>
                                </button>
                                <button type="button" class="ctrl-btn skip-btn skip-back" aria-label="Rewind 5 seconds (Left Arrow)" title="Rewind 5s">
                                    <span class="material-symbols-outlined">replay_5</span>
                                    <span class="btn-badge">-5s</span>
                                </button>
                                <button type="button" class="ctrl-btn skip-btn skip-fwd" aria-label="Forward 5 seconds (Right Arrow)" title="Forward 5s">
                                    <span class="material-symbols-outlined">forward_5</span>
                                    <span class="btn-badge">+5s</span>
                                </button>
                                <div class="volume-container">
                                    <button type="button" class="ctrl-btn volume-btn" aria-label="Mute (M)">
                                        <span class="material-symbols-outlined">volume_up</span>
                                    </button>
                                    <div class="volume-slider-wrap">
                                        <input type="range" class="volume-slider" min="0" max="1" step="0.05" value="1" aria-label="Volume">
                                    </div>
                                </div>
                                <div class="time-display">
                                    <span class="current-time">0:00</span>
                                    <span class="time-separator">/</span>
                                    <span class="duration-time">0:21</span>
                                </div>
                            </div>

                            <div class="controls-right">
                                <button type="button" class="ctrl-btn size-toggle-btn" aria-label="Enlarge video (T)" title="Toggle size (T)">
                                    <span class="material-symbols-outlined">open_in_full</span>
                                </button>
                                <button type="button" class="ctrl-btn fullscreen-btn" aria-label="Fullscreen (F)" title="Fullscreen (F)">
                                    <span class="material-symbols-outlined">fullscreen</span>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Site-wide Search Modal -->
    <div id="searchModal" class="search-modal-backdrop" aria-hidden="true" role="dialog" aria-modal="true" aria-label="Search msitte and laucn">
        <div class="search-modal-panel">
            <div class="search-input-wrapper">
                <span class="material-symbols-outlined search-input-icon">search</span>
                <input type="text" id="siteSearchInput" class="search-input" placeholder="Search skills, guardrails, docs, beta..." autocomplete="off" spellcheck="false">
                <button type="button" class="search-close-btn" id="searchCloseBtn" aria-label="Close search">
                    <span class="material-symbols-outlined">close</span>
                </button>
            </div>
            <div class="search-results-list" id="searchResultsList" role="listbox"></div>
            <div class="search-modal-footer">
                <span><kbd>↑</kbd> <kbd>↓</kbd> to navigate</span>
                <span><kbd>Enter</kbd> to select</span>
                <span><kbd>Esc</kbd> to close</span>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <script src="video-player.js"></script>
</body>
</html>
