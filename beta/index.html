    <link href="style.css" rel="stylesheet">
    <link href="beta.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Code:ital,wght,MONO@0,300..800,1;1,300..800,1&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">

</head>
<body class="beta-body">
    <!-- Background Wavy Ribbons -->
    <div class="beta-waves-bg" aria-hidden="true"></div>

    <!-- Navigation Header -->
    <header class="beta-header">
        <nav class="navbar beta-navbar" aria-label="Main Navigation">
            <a href="/" class="companyLogoLink betaLogoLink" title="msitte" aria-label="msitte home">
                <img src="images/m.png" alt="msitte logo" class="companyLogoImg">
            </a>

            <div class="beta-nav-center">
                <span class="beta-nav-badge">*OUR NAVIGATION*</span>
                <div class="midNav betaMidNav">
                    <a class="navLink betaNavLink" href="/">Home</a>
                    <a class="navLink betaNavLink" href="/developers/docs/introduction.html">Docs</a>
                    <a class="navLink betaNavLink" href="https://discord.gg/5KctFJj9Qk" target="_blank" rel="noopener noreferrer">Community</a>
                    <a class="navLink betaNavLink" href="https://github.com/ucursor/msitte" target="_blank" rel="noopener noreferrer">GitHub</a>
                    <button type="button" class="navSearchBtn betaSearchBtn" id="searchTriggerBtn" aria-label="Search website and docs">
                        <span class="material-symbols-outlined">search</span>
                        <span class="navSearchLabel">Search</span>
                        <kbd>⇧ / ⌘ F</kbd>
                    </button>
                </div>
            </div>
        </nav>
    </header>

    <!-- Main Content -->
    <main class="beta-main">
        <div class="beta-container">
            <!-- Hero Text -->
            <section class="beta-text-hero">
                <h1 class="beta-title">since msitte is beta,</h1>
                <p class="beta-subtitle">
                    you can join us, test it for free and provide<br class="desktop-br">feedback.
                </p>
                <p class="beta-tutorial-text">here is a quick tutorial to use msitte</p>
            </section>

            <!-- White Video Card with HTML5 <video> and Placeholder -->
            <section class="beta-video-card" aria-label="Tutorial Video">
                <video id="betaTutorialVideo" class="tutorial-video" controls playsinline preload="metadata">
                    <!-- Put your video source here when ready, e.g.: -->
                    <!-- <source src="/videos/tutorial.mp4" type="video/mp4"> -->
                    Your browser does not support the video tag.
                </video>
                <div class="video-placeholder" id="videoPlaceholder">
                    <span class="video-placeholder-text">a video</span>
                </div>
            </section>
        </div>
    </main>

    <!-- Site-wide Search Modal -->
    <div id="searchModal" class="search-modal-backdrop" aria-hidden="true" role="dialog" aria-modal="true" aria-label="Search msitte and laucn">
        <div class="search-modal-panel">
            <div class="search-input-wrapper">
                <span class="material-symbols-outlined search-input-icon">search</span>
                <input type="text" id="siteSearchInput" class="search-input" placeholder="Search skills, guardrails, docs, beta..." autocomplete="off" spellcheck="false">
                <button type="button" class="search-close-btn" id="searchCloseBtn" aria-label="Close search">
                    <span class="material-symbols-outlined">close</span>
                </button>
            </div>
            <div class="search-results-list" id="searchResultsList" role="listbox"></div>
            <div class="search-modal-footer">
                <span><kbd>↑</kbd> <kbd>↓</kbd> to navigate</span>
                <span><kbd>Enter</kbd> to select</span>
                <span><kbd>Esc</kbd> to close</span>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        // Automatic video source detection
        document.addEventListener('DOMContentLoaded', () => {
            const video = document.getElementById('betaTutorialVideo');
            const placeholder = document.getElementById('videoPlaceholder');
            
            function checkVideoSource() {
                if (!video || !placeholder) return;
                const hasValidSource = Boolean(
                    (video.src && video.src !== window.location.href) ||
                    (video.querySelector('source') && video.querySelector('source').getAttribute('src'))
                );
                
                if (hasValidSource) {
                    video.style.display = 'block';
                    placeholder.style.display = 'none';
                } else {
                    video.style.display = 'none';
                    placeholder.style.display = 'flex';
                }
            }

            checkVideoSource();
        });
    </script>
</body>
</html>
